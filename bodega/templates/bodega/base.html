<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Music Pro - Bodega Central{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold" href="{% url 'bodega:panel' %}">
            <i class="bi bi-box-seam-fill me-2"></i>Music Pro Tour 2026 | Bodega
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link text-white" href="{% url 'bodega:panel' %}">Inventario Central</a>
            <a class="nav-link text-white" href="{% url 'bodega:movimiento' %}">Registrar Movimiento</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <!-- Renderizado dinámico de mensajes Django (Criterio 1.1.3) -->
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show shadow-sm" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
